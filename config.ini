[config]

; Colour Scheme
colour_scheme.type = "select"
colour_scheme.options.label = "Colour Scheme"
colour_scheme.options.description = "Choose a colour scheme for the site. Manuscript Gold features warm gold and indigo tones. Lapis Indigo uses deep blue and teal. Desert Sand offers warm earth tones. Kapitan pairs ivory lime-wash with deep navy, finial gold and terracotta."
colour_scheme.options.multiOptions.gold = "Manuscript Gold"
colour_scheme.options.multiOptions.indigo = "Lapis Indigo"
colour_scheme.options.multiOptions.sand = "Desert Sand"
colour_scheme.options.multiOptions.kapitan = "Kapitan (ivory, navy and finial gold)"
colour_scheme.options.value = "gold"

; Logo
logo.type = "file"
logo.options.label = "Custom Logo"
logo.options.description = "Upload a custom logo to replace the default NESSIA emblem. Recommended maximum width: 80px. SVG or PNG format preferred."
logo.options.validators.count.validator = "Count"
logo.options.validators.count.options.max = "1"

; Tagline
site_tagline.type = "text"
site_tagline.options.label = "Site Tagline"
site_tagline.options.description = "A brief tagline displayed below the site title in the header. Default: Exploring Semitic Religion, Language and Heritage"

; Show Multilingual Names
show_multilingual_names.type = "checkbox"
show_multilingual_names.options.label = "Display Multilingual Site Names"
show_multilingual_names.options.description = "Show the site name in Arabic, Hebrew and Aramaic below the English title."
show_multilingual_names.value = "1"

; Header Background Image
header_bg.type = "file"
header_bg.options.label = "Header Background Image"
header_bg.options.description = "Upload a background image for the site header. Leave blank to use the default solid colour."
header_bg.options.validators.count.validator = "Count"
header_bg.options.validators.count.options.max = "1"

; Homepage Recent Items
homepage_recent_items.type = "input"
homepage_recent_items.options.label = "Homepage Recent Items"
homepage_recent_items.options.description = "Number of recently added items to display on the homepage."
homepage_recent_items.options.type = "number"
homepage_recent_items.options.size = "6"
homepage_recent_items.options.value = "5"

; Homepage Text
homepage_text.type = "textarea"
homepage_text.options.label = "Homepage Text"
homepage_text.options.description = "Introductory text displayed on the homepage."
homepage_text.options.rows = "5"
homepage_text.options.attribs.class = "html-input"

; Footer Text
footer_text.type = "textarea"
footer_text.options.label = "Footer Text"
footer_text.options.description = "Custom text displayed in the footer area."
footer_text.options.rows = "5"
footer_text.options.attribs.class = "html-input"

; Display Copyright
display_footer_copyright.type = "checkbox"
display_footer_copyright.options.label = "Display Copyright in Footer"
display_footer_copyright.options.description = "Show the site copyright information in the footer."

; Use Advanced Search
use_advanced_search.type = "checkbox"
use_advanced_search.options.label = "Use Advanced Site-wide Search"
use_advanced_search.options.description = "Allow users to search the entire site by record type and choose boolean methods."
use_advanced_search.value = "1"

; Social / profile links
social_links.type = "textarea"
social_links.options.label = "Profile Links"
social_links.options.description = "One URL per line. Icons are chosen automatically (Academia.edu, ORCID, VIAF, Wikidata, X, YouTube, Telegram, Substack, SoundCloud and more). Shown in the footer."
social_links.options.rows = "5"

; Lightbox
image_lightbox.type = "checkbox"
image_lightbox.options.label = "Open Images in Lightbox"
image_lightbox.options.description = "Clicking an image on an item page opens it full-screen, with next/previous for items with several images."
image_lightbox.value = "1"

; Browse view
browse_view.type = "select"
browse_view.options.label = "Default Browse View"
browse_view.options.description = "How items are shown on Browse Items. Visitors can switch between views."
browse_view.options.multiOptions.grid = "Grid (shelf of covers)"
browse_view.options.multiOptions.list = "List (cards with description)"
browse_view.options.multiOptions.table = "Table (title, type, date)"
browse_view.options.value = "grid"

; Mission band
mission_text.type = "textarea"
mission_text.options.label = "Mission Statement"
mission_text.options.description = "Large statement shown above the footer. Wrap words in <strong> to highlight them. Leave blank to hide the band."
mission_text.options.rows = "3"
mission_text.options.value = "Preserving the sources of <strong>Semitic religion, language and heritage</strong> for scholars, students and every curious reader."

mission_button_label.type = "text"
mission_button_label.options.label = "Mission Button Label"
mission_button_label.options.description = "Leave blank to hide the button."
mission_button_label.options.value = "Browse the archive"

mission_button_url.type = "text"
mission_button_url.options.label = "Mission Button Link"
mission_button_url.options.description = "Full URL or site path. Default: Browse Items."

[groups]

appearance.options.legend = "Appearance"
appearance.elements[] = "colour_scheme"
appearance.elements[] = "logo"
appearance.elements[] = "header_bg"
appearance.elements[] = "image_lightbox"

branding.options.legend = "Branding &amp; Identity"
branding.elements[] = "site_tagline"
branding.elements[] = "show_multilingual_names"

homepage.options.legend = "Homepage"
homepage.elements[] = "homepage_recent_items"
homepage.elements[] = "homepage_text"

footer.options.legend = "Footer"
footer.elements[] = "mission_text"
footer.elements[] = "mission_button_label"
footer.elements[] = "mission_button_url"
footer.elements[] = "footer_text"
footer.elements[] = "display_footer_copyright"
footer.elements[] = "social_links"

search.options.legend = "Search"
search.elements[] = "use_advanced_search"
search.elements[] = "browse_view"

[plugins]

exclude_fields = "homepage_text,homepage_recent_items"
