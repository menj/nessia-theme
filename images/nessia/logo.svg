<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8922e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Inner geometric pattern: 8-pointed star (Rub el Hizb) -->
  <g transform="translate(40,40)">
    <!-- First square rotated 0deg -->
    <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="1"/>
    <!-- Second square rotated 45deg -->
    <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="1" transform="rotate(45)"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Centre dot -->
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)"/>
  </g>
</svg>
